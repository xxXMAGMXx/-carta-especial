<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8e9e4">
<title>Un pequeño secreto para ti</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap');
:root{--cream:#fff8f0;--pink:#e8a9b5;--rose:#bd7185;--deep:#8d5267;--ink:#604b4b;--paper:#fffdf8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 20%,#fffaf5 0,#f8e9e4 55%,#f0d9d5 100%);color:var(--ink);font-family:'DM Sans',sans-serif}
button{font:inherit}
.scene{min-height:100svh;display:grid;place-items:center;padding:28px 18px;position:relative;isolation:isolate}
.glow{position:absolute;width:min(75vw,620px);aspect-ratio:1;border-radius:50%;background:#fff8f0a6;filter:blur(55px);z-index:-1}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.14;z-index:5;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E")}
.intro{text-align:center;max-width:600px;margin-bottom:34px;animation:fadeUp 1s both}
.eyebrow{font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:#a97980}
h1{font:clamp(2.5rem,7vw,4.5rem) 'Great Vibes',cursive;color:var(--deep);font-weight:400;margin:10px 0 5px}
.subtitle{font:italic 1rem 'Playfair Display',serif;color:#92777a}
.stage{width:min(92vw,510px);height:330px;display:grid;place-items:center;perspective:1200px;position:relative}
.envelope-wrap{position:relative;width:min(82vw,390px);height:245px;cursor:pointer;filter:drop-shadow(0 24px 25px #9b667326);transition:transform .5s}
.envelope-wrap:hover{transform:translateY(-7px) rotate(-.5deg)}
.envelope{position:absolute;inset:0;background:linear-gradient(145deg,#f1c6cb,#dfa2b0);border-radius:8px;overflow:visible}
.envelope:before,.envelope:after{content:"";position:absolute;inset:0}
.envelope:before{background:linear-gradient(32deg,transparent 49.5%,#e9b5bf 50%) left bottom/50% 100% no-repeat,linear-gradient(-32deg,transparent 49.5%,#e9b5bf 50%) right bottom/50% 100% no-repeat;z-index:3}
.envelope:after{background:linear-gradient(148deg,#f5d1d3 49%,transparent 50%) left top/50% 100% no-repeat,linear-gradient(-148deg,#efc2ca 49%,transparent 50%) right top/50% 100% no-repeat;z-index:2;opacity:.7}
.flap{position:absolute;left:0;top:0;width:100%;height:58%;background:linear-gradient(145deg,#f7d5d7,#eab6c0);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:5;transition:transform 1s cubic-bezier(.2,.75,.2,1);backface-visibility:hidden}
.letter-peek{position:absolute;left:7%;width:86%;height:88%;bottom:5%;background:var(--paper);border-radius:4px;z-index:1;transition:transform 1s cubic-bezier(.2,.75,.2,1),bottom 1s;box-shadow:0 2px 9px #8d52671c}
.seal{position:absolute;z-index:6;left:50%;top:54%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#d98fa0,#a95670);color:#fff4ed;font-size:22px;box-shadow:0 4px 12px #84485b55;transition:opacity .3s,transform .5s}
.envelope-wrap.open .flap{transform:rotateX(180deg);z-index:0}
.envelope-wrap.open .letter-peek{transform:translateY(-145px);bottom:0;transition-delay:.35s}
.envelope-wrap.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.3)}
.hint{position:absolute;bottom:-16px;left:0;right:0;text-align:center;color:#a77c83;font-size:.78rem;letter-spacing:.06em;transition:opacity .3s}
.envelope-wrap.open .hint{opacity:0}
.open-btn,.next-btn,.music-btn{border:1px solid #d9a6af;background:#fff9f4;color:var(--deep);border-radius:99px;padding:13px 23px;cursor:pointer;box-shadow:0 5px 18px #9d66731a;transition:.25s}
.open-btn{margin-top:22px;letter-spacing:.04em}
.open-btn:hover,.next-btn:hover,.music-btn:hover{background:#f4dce0;transform:translateY(-2px)}
.letter-panel{position:fixed;inset:0;z-index:10;background:#5c3e4b66;backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s}
.letter-panel.visible{opacity:1;visibility:visible}
.paper{position:relative;width:min(92vw,620px);max-height:88svh;overflow:auto;background:linear-gradient(135deg,#fffefa,#fff9f0);padding:clamp(28px,6vw,58px);border-radius:5px;box-shadow:0 25px 80px #3e243333;transform:translateY(35px) scale(.97);transition:transform .8s cubic-bezier(.2,.8,.2,1);border:1px solid #f0e5d9}
.visible .paper{transform:translateY(0) scale(1)}
.paper:before{content:"";position:absolute;inset:12px;border:1px solid #e9cfd0;pointer-events:none}
.paper-top{text-align:center;color:#b87e8b;font-size:1.3rem}
.paper h2{text-align:center;font:clamp(2.4rem,7vw,3.5rem) 'Great Vibes',cursive;color:var(--deep);font-weight:400;margin:10px 0 24px}
.letter-copy{font:1rem/1.9 'Playfair Display',serif;color:#6f5958;white-space:pre-line;min-height:180px}
.signature{font:2.2rem 'Great Vibes',cursive;color:var(--rose);text-align:right;margin:22px 8px 5px}
.paper-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.close-btn{position:sticky;float:right;top:0;border:0;background:#f7e7e5;color:#956b75;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px}
.music-btn{position:fixed;right:18px;top:18px;z-index:12;padding:10px 14px;font-size:.8rem;background:#fff9f0c9}
.petal{position:fixed;top:-30px;z-index:1;pointer-events:none;color:#d88f9f;animation:fall linear forwards;opacity:.75}
.sparkle{position:absolute;color:#d99baa;animation:twinkle 2.5s ease-in-out infinite}
.final-screen{position:fixed;inset:0;z-index:20;background:radial-gradient(circle,#fff9f3,#f3dfe0);display:grid;place-items:center;text-align:center;padding:25px;opacity:0;visibility:hidden;transition:.8s}
.final-screen.visible{opacity:1;visibility:visible}
.final-inner{max-width:600px}
.final-heart{font-size:clamp(4rem,15vw,8rem);color:#c8758b;animation:heartbeat 1.4s infinite;filter:drop-shadow(0 12px 20px #c8758b44)}
.final-inner h2{font:clamp(3rem,9vw,5rem) 'Great Vibes',cursive;color:var(--deep);font-weight:400;margin:8px}
.final-inner p{font:italic 1.1rem 'Playfair Display',serif;color:#866b6e}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(560deg);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
@media(max-width:480px){.stage{height:280px}.envelope-wrap{height:205px}.paper{padding:34px 27px}.letter-copy{font-size:.94rem}.music-btn{top:10px;right:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="grain"></div>
<button class="music-btn" id="musicBtn" aria-label="Activar música">♫ Música: apagada</button>
<main class="scene" id="home">
  <div class="glow"></div>
  <span class="sparkle" style="top:18%;left:17%">✧</span><span class="sparkle" style="top:25%;right:18%;animation-delay:1s">✦</span>
  <header class="intro">
    <div class="eyebrow">un detalle hecho con cariño</div>
    <h1>Un pequeño secreto para ti</h1>
    <div class="subtitle">Hay cosas que merecen abrirse despacito…</div>
  </header>
  <section class="stage" aria-label="Sobre cerrado">
    <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Abrir el sobre">
      <div class="letter-peek"></div><div class="envelope"></div><div class="flap"></div><div class="seal">♥</div>
      <div class="hint">Psst… toca el sobre</div>
    </div>
  </section>
  <button class="open-btn" id="openBtn">Abrir mi carta&nbsp; ♡</button>
</main>

<section class="letter-panel" id="letterPanel" aria-hidden="true">
  <article class="paper">
    <button class="close-btn" id="closeBtn" aria-label="Cerrar">×</button>
    <div class="paper-top">♡ &nbsp; ✧ &nbsp; ♡</div>
    <h2>Para mi niña de ojos bonitos</h2>
    <div class="letter-copy" id="letterCopy"></div>
    <div class="signature" id="signature"></div>
    <div class="paper-actions"><button class="next-btn" id="finishBtn">Tengo algo más… ♡</button></div>
  </article>
</section>

<section class="final-screen" id="finalScreen">
  <div class="final-inner">
    <div class="final-heart">♥</div>
    <h2>Y esto apenas es una pequeña parte…</h2>
    <p>Porque hay sentimientos que no caben en una sola carta.</p>
    <button class="next-btn" id="backBtn">Volver a leer ♡</button>
  </div>
</section>
<script>
/* PERSONALIZA AQUÍ EL MENSAJE Y LA FIRMA */
const message = `No sé si exista una forma perfecta de decir todo lo que siento, pero quería encontrar una manera bonita de recordarte lo especial que eres para mí.

A veces, entre los días comunes y las pequeñas cosas, aparecen personas que hacen que todo tenga un brillo diferente. Tú eres una de esas personas, una persona que me hace demasiado bien.

Me gustan las conversaciones, las sonrisas inesperadas y esos momentos que quizá parecen sencillos, pero que terminan convirtiéndose en recuerdos que por siempre quedaran en mi mente.

Hice esta carta para que sepas lo especial e importante que eres para mi, preciosa.

Gracias por ser tú. ♡`;
const signatureText = "Con mucho cariño…";

const envelope=document.getElementById('envelope');
const panel=document.getElementById('letterPanel');
const copy=document.getElementById('letterCopy');
const signature=document.getElementById('signature');
const finalScreen=document.getElementById('finalScreen');
let opened=false, typingTimer=null, audioCtx=null, musicOn=false, musicTimer=null;

function openLetter(){
  if(opened)return; opened=true;
  if (!musicOn) document.getElementById('musicBtn').click();
  envelope.classList.add('open');
  document.querySelector('.open-btn').textContent='La carta está lista ♡';
  setTimeout(()=>{panel.classList.add('visible');panel.setAttribute('aria-hidden','false');typeMessage();},1050);
  for(let i=0;i<18;i++)setTimeout(createPetal,i*90);
}
function typeMessage(){
  clearInterval(typingTimer);copy.textContent='';signature.textContent='';
  let i=0;typingTimer=setInterval(()=>{
    copy.textContent+=message.charAt(i);i++;
    if(i>=message.length){clearInterval(typingTimer);signature.textContent=signatureText;}
  },27);
}
function createPetal(){
  const p=document.createElement('span');p.className='petal';
  p.textContent=['✿','♡','❀','✧'][Math.floor(Math.random()*4)];
  p.style.left=Math.random()*100+'vw';p.style.fontSize=(12+Math.random()*16)+'px';
  p.style.animationDuration=(7+Math.random()*7)+'s';p.style.setProperty('--drift',(Math.random()*180-90)+'px');
  document.body.appendChild(p);setTimeout(()=>p.remove(),15000);
}
function closeLetter(){panel.classList.remove('visible');panel.setAttribute('aria-hidden','true');}
document.getElementById('openBtn').addEventListener('click',openLetter);
envelope.addEventListener('click',openLetter);
envelope.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLetter();}});
document.getElementById('closeBtn').addEventListener('click',closeLetter);
panel.addEventListener('click',e=>{if(e.target===panel)closeLetter();});
document.getElementById('finishBtn').addEventListener('click',()=>{panel.classList.remove('visible');setTimeout(()=>finalScreen.classList.add('visible'),350);});
document.getElementById('backBtn').addEventListener('click',()=>{finalScreen.classList.remove('visible');setTimeout(()=>panel.classList.add('visible'),350);});

function tone(freq,duration,when=0){
  if(!audioCtx)return;
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,audioCtx.currentTime+when);
  gain.gain.exponentialRampToValueAtTime(.035,audioCtx.currentTime+when+.08);
  gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+duration);
  osc.connect(gain);gain.connect(audioCtx.destination);osc.start(audioCtx.currentTime+when);osc.stop(audioCtx.currentTime+when+duration+.02);
}
document.getElementById('musicBtn').addEventListener('click',async()=>{
  const btn=document.getElementById('musicBtn');
  if(!musicOn){
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();musicOn=true;
    const melody=[523.25,659.25,783.99,659.25,587.33,698.46,783.99,698.46];
    let n=0;const play=()=>{if(!musicOn)return;tone(melody[n%melody.length],.75);n++;};
    play();musicTimer=setInterval(play,850);btn.textContent='♫ Música: encendida';
  }else{musicOn=false;clearInterval(musicTimer);btn.textContent='♫ Música: apagada';}
});
setInterval(()=>{if(Math.random()>.35)createPetal()},1800);
</script>
</body>
</html>
